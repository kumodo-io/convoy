name: Actions Lint

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - ".actions/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Run actions linter
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_ENABLE_TOOLS: jactionlint
      - shell: sh
        run: mise run actionlint
