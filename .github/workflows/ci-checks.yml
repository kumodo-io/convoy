name: CI Checks - Format, Lint, Test

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: $/.github/workflows/resolve-paths.yml
    permissions:
      pull-requests: read # requires to list PR files

  format:
    name: Run 'go vet' and 'go fix' and check diff
    needs: [changes]
    if: ${{ needs.changes.outputs.require-ci-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_ENABLE_TOOLS: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
      - shell: sh
        run: go mod download
      - shell: sh
        run: mise run format
        env:
          MISE_JOBS: 1
      - shell: sh
        run: git diff --exit-code

  lint:
    name: Run linters and code quality checks
    needs: [changes]
    if: ${{ needs.changes.outputs.require-ci-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_ENABLE_TOOLS: go,golangci-lint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'go.mod', '.mise/conf.d/00-tools.toml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
      - shell: sh
        run: go mod download
      - shell: sh
        env:
          GOLANGCI_LINT_TIMEOUT: 10m
        run: mise run lint

  test:
    name: Run tests
    needs: [changes]
    if: ${{ needs.changes.outputs.require-ci-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_ENABLE_TOOLS: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
      - shell: sh
        run: mise run test
