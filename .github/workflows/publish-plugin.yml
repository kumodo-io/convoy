name: Plugin Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish kubectl-convoy archives
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # requires to upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        env:
          MISE_ENABLE_TOOLS: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
      - name: Package plugin
        shell: sh
        env:
          TAG: ${{ github.ref_name }}
        run: mise run package-plugin "$TAG" dist
      # release-please creates the release together with the tag; the retries
      # cover the case where the tag event arrives first.
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for _ in 1 2 3 4 5 6; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$TAG" dist/* --clobber
