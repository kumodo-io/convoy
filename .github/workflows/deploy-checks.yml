name: Deploy Checks - Kustomize and Chart

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: $/.github/workflows/resolve-paths.yml
    permissions:
      pull-requests: read # requires to list PR files

  kustomize:
    name: Build and validate kustomizations
    needs: [changes]
    if: ${{ needs.changes.outputs.require-deploy-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: kustomize,kubeconform,yq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - shell: sh
        run: mise run deploy-check

  chart:
    name: Lint, test and validate chart
    needs: [changes]
    if: ${{ needs.changes.outputs.require-deploy-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: helm,github:helm-unittest/helm-unittest,kubeconform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - shell: sh
        run: mise run chart-check
