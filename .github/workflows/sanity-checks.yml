name: Sanity Checks - Mod Tidy and Codegen

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: $/.github/workflows/resolve-paths.yml
    permissions:
      pull-requests: read # requires to list PR files

  verify-tidy:
    name: Run 'go mod tidy' and check diff
    needs: [changes]
    if: ${{ needs.changes.outputs.require-sanity-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - shell: sh
        run: mise run tidy
      - shell: sh
        run: git diff --exit-code

  verify-codegen:
    name: Run code-generators and check diff
    needs: [changes]
    if: ${{ needs.changes.outputs.require-sanity-checks == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - shell: sh
        run: mise run codegen
      - shell: sh
        run: git diff --exit-code
