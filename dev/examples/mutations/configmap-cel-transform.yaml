# celTransform content sourced from a ConfigMap.
#
# The CEL expression returns a map overlay that is RFC7386-merged onto each
# matched object. Available variables:
#   cluster -> the target Cluster's name (cluster.name) + its Spec.Metadata keys
#              (e.g. cluster.region)
#   self    -> the Release's name / namespace / labels / annotations
#   object  -> the object being mutated
#
#   mutations:
#     - type: celTransform
#       target: { group: apps, version: v1, kind: Deployment }
#       from: { kind: ConfigMap, name: mutation-cel-transform, path: transform.cel }
#   from.name and from.path may themselves be templated with {.cluster,.self}
#   (release-level only, no .object), e.g. name: "{{ .cluster.name }}-transform".
apiVersion: v1
kind: ConfigMap
metadata:
  name: mutation-cel-transform
  namespace: default
data:
  transform.cel: |
    {
      "metadata": {
        "labels": {"convoy.kumodo.io/release": self.name},
        "annotations": {"convoy.kumodo.io/region": cluster.region}
      }
    }
