# goTemplate content sourced from a Secret.
#
# Use a Secret when the template embeds sensitive content. The overlay is
# RFC7386-merged onto each matched object; the {.cluster,.self,.object} context is
# available exactly as with a ConfigMap source. stringData is shown for
# readability; the resolver reads Secret.Data.
#
#   mutations:
#     - type: goTemplate
#       target: { group: apps, version: v1, kind: Deployment }
#       from: { kind: Secret, name: mutation-go-template, path: overlay.yaml }
# Context includes .cluster.name (the Cluster object's name) alongside its
# metadata; from.name and from.path may be templated with {.cluster,.self}.
apiVersion: v1
kind: Secret
metadata:
  name: mutation-go-template
  namespace: default
type: Opaque
stringData:
  overlay.yaml: |
    spec:
      template:
        metadata:
          annotations:
            example.convoy.kumodo.io/injected-token: "s3cr3t-for-{{ .self.name }}"
