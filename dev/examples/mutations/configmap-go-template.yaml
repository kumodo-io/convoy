# goTemplate content sourced from a ConfigMap.
#
# The template renders a partial overlay that is RFC7386-merged onto each matched
# object (it injects/updates fields, it does not replace the object). Context:
#   .cluster  -> the target Cluster's name (.cluster.name) + its Spec.Metadata
#                keys (e.g. {{ .cluster.region }})
#   .self     -> the Release's name / namespace / labels / annotations
#   .object   -> the object being mutated (e.g. {{ .object.metadata.name }})
#
#   mutations:
#     - type: goTemplate
#       target: { group: apps, version: v1, kind: Deployment }
#       from: { kind: ConfigMap, name: mutation-go-template, path: overlay.yaml }
#   from.name and from.path may themselves be templated with {.cluster,.self}
#   (release-level only, no .object), e.g. name: "{{ .cluster.name }}-overlay".
apiVersion: v1
kind: ConfigMap
metadata:
  name: mutation-go-template
  namespace: default
data:
  overlay.yaml: |
    metadata:
      labels:
        convoy.kumodo.io/release: "{{ .self.name }}"
      annotations:
        convoy.kumodo.io/type: "{{ .cluster.type }}"
        convoy.kumodo.io/role: "{{ .cluster.role }}"
