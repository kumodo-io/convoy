# strategicMergePatch content sourced from a Secret.
#
# Use a Secret rather than a ConfigMap when the patch content itself is sensitive
# (e.g. injecting a token). The mechanism is identical — only `from.kind` differs.
# stringData is shown for readability; the resolver reads Secret.Data.
#
#   mutations:
#     - type: strategicMergePatch
#       target: { group: apps, version: v1, kind: Deployment }
#       from: { kind: Secret, name: mutation-strategic-merge, path: patch.yaml }
# The patch body is Go-templated with {.cluster,.self,.object}; from.name and
# from.path may also be templated with {.cluster,.self}.
apiVersion: v1
kind: Secret
metadata:
  name: mutation-strategic-merge
  namespace: default
type: Opaque
stringData:
  patch.yaml: |
    spec:
      template:
        metadata:
          annotations:
            example.convoy.kumodo.io/injected-token: "s3cr3t-value-from-secret"
