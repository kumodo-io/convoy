# celTransform content sourced from a Secret.
#
# Use a Secret when the expression embeds sensitive content. The CEL expression
# returns a map overlay that is RFC7386-merged onto each matched object; the
# cluster / self / object vars are available exactly as with a ConfigMap source.
# stringData is shown for readability; the resolver reads Secret.Data.
#
#   mutations:
#     - type: celTransform
#       target: { group: apps, version: v1, kind: Deployment }
#       from: { kind: Secret, name: mutation-cel-transform, path: transform.cel }
# Context includes cluster.name (the Cluster object's name) alongside its
# metadata; from.name and from.path may be templated with {cluster,self}.
apiVersion: v1
kind: Secret
metadata:
  name: mutation-cel-transform
  namespace: default
type: Opaque
stringData:
  transform.cel: |
    {
      "spec": {
        "template": {
          "metadata": {
            "annotations": {"example.convoy.kumodo.io/injected-token": "s3cr3t-for-" + self.name}
          }
        }
      }
    }
