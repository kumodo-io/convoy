apiVersion: core.convoy.kumodo.io/v1alpha1
kind: Release
metadata:
  name: podinfo-ocireg-in-cluster
  namespace: default
spec:
  clusterRef:
    name: dev-local
  source:
    type: ociRegistry
    ociRegistry:
      name: podinfo
      namespace: default
      artifact:
        name: podinfo
        version: "6.10.2"
  content:
    type: helm
    helm:
      releaseName: podinfo-from-ocireg
      releaseNamespace: default
      dependencyMode: vendored
  syncPolicy:
    automatic: true
    prune:
      orphaned: false
      includeCRDs: false
      includeNamespaces: false
    interval: 1m
    waveStrategy:
      strategy: waitForApplied
      wave: 1
