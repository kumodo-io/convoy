apiVersion: core.convoy.kumodo.io/v1alpha1
kind: Release
metadata:
  name: podinfo-helmreg-in-cluster
  namespace: default
spec:
  clusterRef:
    name: dev-local
  source:
    type: helmRegistry
    helmRegistry:
      name: podinfo
      namespace: default
      chart:
        name: podinfo
        version: "6.12.0"
  content:
    type: helm
    helm:
      releaseName: podinfo-from-helmreg
      releaseNamespace: default
      dependencyMode: vendored
      values:
        - type: gitRepository
          gitRepository:
            name: podinfo-values
            namespace: default
            ref:
              branch: main
            paths:
              - podinfo/values.yaml
        - type: inline
          inline:
            image:
              tag: 6.13.0
  syncPolicy:
    automatic: true
    prune:
      orphaned: false
      includeCRDs: false
      includeNamespaces: false
    interval: 1m
