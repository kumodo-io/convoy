apiVersion: v1
kind: ServiceAccount
metadata:
  name: convoy-controller-manager
  namespace: convoy-system
---
# The controller talks to convoy resources through the host kube-apiserver's
# aggregation layer, which delegates authz back to host-cluster RBAC. So the
# controller SA needs explicit RBAC on the convoy types it reconciles.
# Discovery (ServerVersion/ServerGroups, used to probe target clusters) is
# already covered by the default system:discovery / system:public-info-viewer
# bindings every authenticated ServiceAccount has, so no extra rule is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convoy-controller-manager
rules:
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["clusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["source.convoy.kumodo.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.convoy.kumodo.io"]
    resources: ["gitrepositories/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases/status"]
    verbs: ["get", "update", "patch"]
  # Durable per-Release applied-resource inventory (prune record + wave/health
  # rollup). The controller owns its lifecycle: creates/updates it via SSA on
  # apply, reads it to prune (surviving restarts), and deletes it on finalize.
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releaseinventories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Resolve credential material referenced by a Cluster's auth spec (e.g. the
  # kubeconfig Secret for agentless connection). Cluster-wide because Cluster
  # objects — and their referenced Secrets — may live in any namespace.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
  # Sharding: membership + shard leases partition work across replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convoy-controller-manager
subjects:
  - kind: ServiceAccount
    name: convoy-controller-manager
    namespace: convoy-system
---
# Dev-only: applying rendered manifests to the in-cluster (self) target runs as
# the controller's own ServiceAccount, so it needs broad apply rights on the host
# cluster. Scope this down for production (or use a dedicated apply identity).
# The managed (kubeconfig) target applies with the kubeconfig identity instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-controller-manager-apply
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: convoy-controller-manager
    namespace: convoy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy-controller-manager
  namespace: convoy-system
  labels:
    app: convoy-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convoy-controller-manager
  template:
    metadata:
      labels:
        app: convoy-controller-manager
    spec:
      serviceAccountName: convoy-controller-manager
      # Dev-only: runs as root with a writable root fs so Tilt live-update can
      # overwrite /convoy-controller-manager in place. Not a production posture.
      containers:
        - name: controller-manager
          image: convoy-controller-manager:dev
          imagePullPolicy: IfNotPresent
          args:
            - --resync=2m
            - --workers=2
          # Sharding identity: replica-id and lease-namespace resolve from these.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
