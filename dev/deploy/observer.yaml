apiVersion: v1
kind: ServiceAccount
metadata:
  name: convoy-observer
  namespace: convoy-system
---
# The observer reads Releases/Clusters/sources through the aggregation layer,
# writes the Release InSync condition (releases/status), and requests a sync on
# drift (releases/sync). It never writes source or cluster status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convoy-observer
rules:
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases", "clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases/status"]
    verbs: ["get", "update", "patch"]
  # Request a reconcile on detected drift (automatic mode only).
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases/sync"]
    verbs: ["create"]
  - apiGroups: ["source.convoy.kumodo.io"]
    resources: ["gitrepositories", "helmregistries", "ociregistries"]
    verbs: ["get", "list", "watch"]
  # Health rule sets feed the health-assessment loop.
  - apiGroups: ["extensions.convoy.kumodo.io"]
    resources: ["globalhealthrulesets", "healthrulesets"]
    verbs: ["get", "list", "watch"]
  # Resolve credential material referenced by a Cluster's auth spec (kubeconfig
  # Secret for agentless) and Helm value sources.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convoy-observer
subjects:
  - kind: ServiceAccount
    name: convoy-observer
    namespace: convoy-system
---
# Dev-only: drift detection dry-run-applies to the in-cluster (self) target, and
# a dry-run apply authorizes as if it were a real apply — so the observer needs
# the same broad apply rights the controller has on the host cluster. Scope this
# down for production; the managed (kubeconfig) target uses the kubeconfig identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-observer-apply
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: convoy-observer
    namespace: convoy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy-observer
  namespace: convoy-system
  labels:
    app: convoy-observer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convoy-observer
  template:
    metadata:
      labels:
        app: convoy-observer
    spec:
      serviceAccountName: convoy-observer
      # Dev-only: runs as root with a writable root fs so Tilt live-update can
      # overwrite /convoy-observer in place. Not a production posture.
      containers:
        - name: observer
          image: convoy-observer:dev
          imagePullPolicy: IfNotPresent
          args:
            - --resync=2m
            - --workers=2
            - --serve-addr=:8080
          ports:
            - name: http
              containerPort: 8080
---
# The apiserver proxies the Release /preview (and later /diff) subresources to
# this Service. Its DNS matches the apiserver's default --observer-url.
apiVersion: v1
kind: Service
metadata:
  name: convoy-observer
  namespace: convoy-system
spec:
  selector:
    app: convoy-observer
  ports:
    - name: http
      port: 8080
      targetPort: http
