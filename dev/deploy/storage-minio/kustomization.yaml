# MinIO (S3) render store overlay: deploys an in-cluster MinIO + bucket, and points
# the controller at it via the gocloud s3blob driver. Durable and shared across
# replicas (unlike file://); exercises the real S3 code path end to end.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - minio.yaml
patches:
  - target:
      kind: Deployment
      name: convoy-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --render-store-url=s3://convoy-renders?endpoint=http://minio:9000&region=us-east-1&use_path_style=true&disable_https=true&hostname_immutable=true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: convoy-minio
              key: AWS_ACCESS_KEY_ID
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: convoy-minio
              key: AWS_SECRET_ACCESS_KEY
