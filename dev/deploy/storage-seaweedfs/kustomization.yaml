# SeaweedFS (S3) render store overlay: deploys an in-cluster SeaweedFS + bucket, and points
# both the controller (writer) and observer (reader) at it via the gocloud s3blob
# driver. Durable and shared across pods (unlike file://); exercises the real S3
# code path and the store-backed read features end to end.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - seaweedfs.yaml
patches:
  - target:
      kind: Deployment
      name: convoy-controller-manager
    patch: &s3Store |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --render-store-url=s3://convoy-renders?endpoint=http://seaweedfs:8333&region=us-east-1&use_path_style=true&disable_https=true&hostname_immutable=true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: convoy-seaweedfs
              key: AWS_ACCESS_KEY_ID
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: convoy-seaweedfs
              key: AWS_SECRET_ACCESS_KEY
  - target:
      kind: Deployment
      name: convoy-observer
    patch: *s3Store
