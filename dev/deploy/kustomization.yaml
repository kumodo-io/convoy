apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - etcd.yaml
  - apiserver.yaml
  - apiservices.yaml
  - controller.yaml
  - observer.yaml
  # health-rules.yaml is intentionally NOT here: it is an instance of an
  # aggregated kind (GlobalHealthRuleSet), so it can only be applied after the
  # apiserver is serving. It is applied separately once the APIService is
  # Available (see the Makefile kind-deploy target and the Tiltfile).
