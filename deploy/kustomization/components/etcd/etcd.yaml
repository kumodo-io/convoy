apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: convoy-etcd
  namespace: convoy-system
  labels:
    app.kubernetes.io/name: convoy-etcd
    app.kubernetes.io/component: etcd
spec:
  serviceName: convoy-etcd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: convoy-etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convoy-etcd
        app.kubernetes.io/component: etcd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.16-0
          command:
            - etcd
            # A subdirectory, because etcd requires 0700 on its data dir and the volume root is group-owned.
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://convoy-etcd.convoy-system.svc:2379
          ports:
            - name: client
              containerPort: 2379
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: convoy-etcd
  namespace: convoy-system
spec:
  selector:
    app.kubernetes.io/name: convoy-etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
