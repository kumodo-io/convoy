# Enables the durable render store for /history and historical /diff. Both the
# controller (writer) and the observer (reader) must use the same store, so a
# per-process mem:// URL does not work here.
#
# The component does not contain the store settings. Generate them in your
# overlay, because a generated name changes with its content and a change then
# restarts the pods:
#
#   configMapGenerator:
#     - name: convoy-render-store
#       namespace: convoy-system
#       literals:
#         - url=s3://my-bucket?region=eu-west-1
#   # Optional: provider credentials, loaded as env vars.
#   secretGenerator:
#     - name: convoy-render-store
#       namespace: convoy-system
#       envs:
#         - render-store.env
#
# Without the ConfigMap, both pods stay in CreateContainerConfigError.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: convoy-(controller-manager|observer)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --render-store-url=$(RENDER_STORE_URL)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RENDER_STORE_URL
          valueFrom:
            configMapKeyRef:
              name: convoy-render-store
              key: url
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: convoy-render-store
              optional: true
