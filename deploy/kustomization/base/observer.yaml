apiVersion: v1
kind: ServiceAccount
metadata:
  name: convoy-observer
  namespace: convoy-system
---
# The observer reads Releases/Clusters/sources through the aggregation layer,
# writes the Release InSync condition (releases/status), and requests a sync on
# drift (releases/sync). It never writes source or cluster status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convoy-observer
rules:
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases", "clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases/status"]
    verbs: ["get", "update", "patch"]
  # Request a reconcile on detected drift (automatic mode only).
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases/sync"]
    verbs: ["create"]
  # Per-Release inventory: the observer co-owns each entry's health fields
  # (state/firstUnhealthy/message) via SSA, and reads it back for progress
  # anchors and the /health payload. Lifecycle (create/delete) is the
  # controller's; the observer only upserts health, so no delete verb.
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releaseinventories"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["source.convoy.kumodo.io"]
    resources: ["gitrepositories", "helmregistries", "ociregistries"]
    verbs: ["get", "list", "watch"]
  # Health rule sets feed the health-assessment loop.
  - apiGroups: ["extensions.convoy.kumodo.io"]
    resources: ["globalhealthrulesets", "healthrulesets"]
    verbs: ["get", "list", "watch"]
  # Resolve credential material referenced by a Cluster's auth spec (kubeconfig
  # Secret for agentless) and Helm value sources.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
  # Sharding: membership + shard leases partition work across replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convoy-observer
subjects:
  - kind: ServiceAccount
    name: convoy-observer
    namespace: convoy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy-observer
  namespace: convoy-system
  labels:
    app.kubernetes.io/name: convoy-observer
    app.kubernetes.io/component: observer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: convoy-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convoy-observer
        app.kubernetes.io/component: observer
    spec:
      serviceAccountName: convoy-observer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: ghcr.io/kumodo-io/convoy/convoy-observer
          args:
            - --shards=32
            # Each replica caches only its owned shards, so memory scales with replica count.
            - --shard-scoped-cache
            - --serve-addr=:8080
          env:
            # Helm and git clients keep their caches under $HOME.
            - name: HOME
              value: /tmp
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# The apiserver proxies the Release /preview and /diff subresources to this Service.
apiVersion: v1
kind: Service
metadata:
  name: convoy-observer
  namespace: convoy-system
spec:
  selector:
    app.kubernetes.io/name: convoy-observer
  ports:
    - name: http
      port: 8080
      targetPort: http
