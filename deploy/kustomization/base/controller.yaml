apiVersion: v1
kind: ServiceAccount
metadata:
  name: convoy-controller-manager
  namespace: convoy-system
---
# The controller talks to convoy resources through the host kube-apiserver's
# aggregation layer, which delegates authz back to host-cluster RBAC. So the
# controller SA needs explicit RBAC on the convoy types it reconciles.
# Discovery (ServerVersion/ServerGroups, used to probe target clusters) is
# already covered by the default system:discovery / system:public-info-viewer
# bindings every authenticated ServiceAccount has, so no extra rule is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convoy-controller-manager
rules:
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["clusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["source.convoy.kumodo.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.convoy.kumodo.io"]
    resources: ["gitrepositories/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releases/status"]
    verbs: ["get", "update", "patch"]
  # Durable per-Release applied-resource inventory (prune record + wave/health
  # rollup). The controller owns its lifecycle: creates/updates it via SSA on
  # apply, reads it to prune (surviving restarts), and deletes it on finalize.
  - apiGroups: ["core.convoy.kumodo.io"]
    resources: ["releaseinventories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Resolve credential material referenced by a Cluster's auth spec (e.g. the
  # kubeconfig Secret for agentless connection). Cluster-wide because Cluster
  # objects — and their referenced Secrets — may live in any namespace.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
  # Sharding: membership + shard leases partition work across replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convoy-controller-manager
subjects:
  - kind: ServiceAccount
    name: convoy-controller-manager
    namespace: convoy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy-controller-manager
  namespace: convoy-system
  labels:
    app.kubernetes.io/name: convoy-controller-manager
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: convoy-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convoy-controller-manager
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: convoy-controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller-manager
          image: ghcr.io/kumodo-io/convoy/convoy-controller-manager
          args:
            - --shards=32
            # Each replica caches only its owned shards, so memory scales with replica count.
            - --shard-scoped-cache
          env:
            # Helm and git clients keep their caches under $HOME.
            - name: HOME
              value: /tmp
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
