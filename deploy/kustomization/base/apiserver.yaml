apiVersion: v1
kind: ServiceAccount
metadata:
  name: convoy-apiserver
  namespace: convoy-system
---
# Delegates authn/authz to the host kube-apiserver (TokenReview/SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-apiserver-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: convoy-system
---
# Reads the requestheader CA from extension-apiserver-authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: convoy-apiserver-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: convoy-system
---
# Informers of the default admission chain (NamespaceLifecycle, webhooks,
# ValidatingAdmissionPolicy) and API Priority and Fairness.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convoy-apiserver
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["flowschemas", "prioritylevelconfigurations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convoy-apiserver
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: convoy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy-apiserver
  namespace: convoy-system
  labels:
    app.kubernetes.io/name: convoy-apiserver
    app.kubernetes.io/component: apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: convoy-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convoy-apiserver
        app.kubernetes.io/component: apiserver
    spec:
      serviceAccountName: convoy-apiserver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apiserver
          image: ghcr.io/kumodo-io/convoy/convoy-apiserver
          args:
            - --secure-port=8443
            - --observer-url=http://convoy-observer.convoy-system.svc:8080
            - --shards=32
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: convoy-apiserver
  namespace: convoy-system
spec:
  selector:
    app.kubernetes.io/name: convoy-apiserver
  ports:
    - name: https
      port: 443
      targetPort: https
