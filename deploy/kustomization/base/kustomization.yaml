# The base is not deployable alone: it has no etcd and no TLS mode. Use the
# default overlay, or combine the base with one etcd and one TLS component.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: convoy
resources:
  - namespace.yaml
  - apiserver.yaml
  - apiservices.yaml
  - controller.yaml
  - observer.yaml
