{{- include "convoy.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: convoy-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
---
# Delegates authn/authz to the host kube-apiserver (TokenReview/SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-apiserver-auth-delegator
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: {{ .Release.Namespace }}
---
# Reads the requestheader CA from extension-apiserver-authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: convoy-apiserver-auth-reader
  namespace: kube-system
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: {{ .Release.Namespace }}
---
# Informers of the default admission chain (NamespaceLifecycle, webhooks,
# ValidatingAdmissionPolicy) and API Priority and Fairness.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convoy-apiserver
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["flowschemas", "prioritylevelconfigurations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convoy-apiserver
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convoy-apiserver
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: {{ .Release.Namespace }}
---
# Reads the observer's sharding leases to send each Release's /preview, /diff,
# /health and /history to the observer replica that owns it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: convoy-apiserver-observer-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: convoy-apiserver-observer-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: convoy-apiserver-observer-leases
subjects:
  - kind: ServiceAccount
    name: convoy-apiserver
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convoy-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      {{- include "convoy.selectorLabels" "apiserver" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 8 }}
      {{- with .Values.apiserver.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: convoy-apiserver
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "convoy.podSecurityContext" . | nindent 8 }}
      containers:
        - name: apiserver
          image: {{ include "convoy.image" (dict "root" . "component" "apiserver") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secure-port=8443
            - --observer-url={{ include "convoy.observerURL" . }}
            - --shards={{ .Values.shards }}
            {{- if .Values.etcd.enabled }}
            - --etcd-servers=http://convoy-etcd.{{ .Release.Namespace }}.svc:2379
            {{- else }}
            - --etcd-servers={{ join "," .Values.etcd.external.servers }}
            - --etcd-cafile=/etc/convoy/etcd/ca.crt
            - --etcd-certfile=/etc/convoy/etcd/tls.crt
            - --etcd-keyfile=/etc/convoy/etcd/tls.key
            {{- end }}
            {{- if .Values.tls.insecure }}
            - --cert-dir=/tmp/certs
            {{- else }}
            - --tls-cert-file=/etc/convoy/tls/tls.crt
            - --tls-private-key-file=/etc/convoy/tls/tls.key
            {{- end }}
            {{- range .Values.apiserver.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            # The observer's sharding leases live in this namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.apiserver.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "convoy.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if not .Values.tls.insecure }}
            - name: serving-cert
              mountPath: /etc/convoy/tls
              readOnly: true
            {{- end }}
            {{- if not .Values.etcd.enabled }}
            - name: etcd-client
              mountPath: /etc/convoy/etcd
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.tls.insecure }}
        - name: serving-cert
          secret:
            secretName: {{ include "convoy.servingSecret" . }}
        {{- end }}
        {{- if not .Values.etcd.enabled }}
        - name: etcd-client
          secret:
            secretName: {{ .Values.etcd.external.clientSecret }}
        {{- end }}
      {{- include "convoy.scheduling" .Values.apiserver | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: convoy-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "convoy.componentLabels" (dict "root" . "component" "apiserver") | nindent 4 }}
spec:
  selector:
    {{- include "convoy.selectorLabels" "apiserver" | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
