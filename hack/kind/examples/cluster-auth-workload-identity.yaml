apiVersion: core.convoy.kumodo.io/v1alpha1
kind: Cluster
metadata:
  name: dev-local
  namespace: default
spec:
  connectionMode: agentless
  agentless:
    server: https://kubernetes.default.svc:443
    auth:
      type: workloadIdentity
    connectionParameters:
      qps: 50
      burst: 100
      timeout: 30s
  deletionPolicy:
    releases: block
    workloads: prune
    onUnreachable: block
